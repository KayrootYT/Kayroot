name: Build Kayroot Engine APK v2.20

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kayroot Engine v2.20
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Android SDK packages directly
      # Avoid setup-android action's package resolution error
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK: $SDK"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            echo "Available SDK directories:"
            ls -la "$SDK" 2>/dev/null || true
            find /usr/local/lib/android/sdk/cmdline-tools \
              -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 4. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 5. Extract Kayroot Engine v2.20 project
      - name: Extract Kayroot Engine v2.20
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/Kayroot_Engine_2_20.zip"
          DEST="$RUNNER_TEMP/kayroot220"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Kayroot_Engine_2_20.zip not found."
            echo "Upload the ZIP to the repository root."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          SETTINGS_FILE=$(find "$DEST" \
            -name settings.gradle.kts \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper not found; using installed Gradle 8.9."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          echo "----- Project settings -----"
          cat "$SETTINGS_FILE"

      # 6. Verify application ID and v2.20 version
      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com\.kayroot\.engine"' "$GRADLE_FILE" || {
            echo "::error::Expected applicationId com.kayroot.engine."
            exit 1
          }

          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*220([[:space:]]|$)' "$GRADLE_FILE" || {
            echo "::error::Expected versionCode = 220."
            echo "Update app/build.gradle.kts inside the ZIP."
            exit 1
          }

          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"2\.20"' "$GRADLE_FILE" || {
            echo "::error::Expected versionName = 2.20."
            echo "Update app/build.gradle.kts inside the ZIP."
            exit 1
          }

          echo "Kayroot Engine v2.20 configuration verified."

      # 7. Configure optional custom release signing
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            : "${KS_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
            : "${KS_ALIAS:?Missing KEY_ALIAS secret}"
            : "${KS_KEY_PASSWORD:?Missing KEY_PASSWORD secret}"

            KS="$RUNNER_TEMP/kayroot-release.jks"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"

            if [ ! -s "$KS" ]; then
              echo "::error::Keystore file is empty."
              exit 1
            fi

            echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> "$GITHUB_ENV"

            echo "Custom release keystore configured."
          else
            echo "No custom keystore supplied."
            echo "The project will use its configured debug-signing fallback."
          fi

      # 8. Build release APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 9. Verify and rename APK
      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          OUTPUT="$GITHUB_WORKSPACE/KayrootEngine-v2.20.apk"
          SOURCE="$APK_DIR/app-release.apk"

          if [ ! -f "$SOURCE" ]; then
            SOURCE=$(find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print -quit 2>/dev/null || true)
          fi

          if [ -z "${SOURCE:-}" ] || [ ! -f "$SOURCE" ]; then
            echo "::error::Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          cp "$SOURCE" "$OUTPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "::error::Generated APK is empty."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$OUTPUT"

      # 10. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KayrootEngine-v2.20-apk
          path: KayrootEngine-v2.20.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Publish GitHub Release for v* tags
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KayrootEngine-v2.20.apk
          generate_release_notes: true
