name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$KS" -storepass kayroot123 -keypass kayroot123 \
              -alias kayroot -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kayroot Engine"
            echo "KEYSTORE_PASSWORD=kayroot123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=kayroot" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=kayroot123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk KayrootEngine-v2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KayrootEngine-apk
          path: KayrootEngine-v2.0.apk

      - name: Publish GitHub Release (only on tags like v2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KayrootEngine-v2.0.apk
