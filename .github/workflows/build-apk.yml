
name: Build Kayroot Engine APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and locate project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _unzipped_project

          shopt -s nullglob
          zip_files=(./*.zip)

          for z in "${zip_files[@]}"; do
            echo "Extracting: $z"
            unzip -oq "$z" -d _unzipped_project
          done

          # Prefer the actual Kayroot project settings file.
          F=""

          for candidate in \
            "./settings.gradle.kts" \
            "./_unzipped_project/settings.gradle.kts"; do
            if [ -f "$candidate" ]; then
              F="$candidate"
              break
            fi
          done

          if [ -z "$F" ]; then
            F=$(find . \
              -path "*/.git/*" -prune -o \
              -path "*/build/*" -prune -o \
              -name settings.gradle.kts -print -quit)
          fi

          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts not found."
            echo "Upload the Kayroot project ZIP or project source files."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$F")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          echo "Project configuration:"
          cat "$F"
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            : "${KEYSTORE_PASSWORD_SECRET:?Missing KEYSTORE_PASSWORD secret}"
            : "${KEY_ALIAS_SECRET:?Missing KEY_ALIAS secret}"
            : "${KEY_PASSWORD_SECRET:?Missing KEY_PASSWORD secret}"

            KS="$RUNNER_TEMP/kayroot-release.jks"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"

            echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

            echo "Custom release signing configured."
          else
            echo "No custom keystore supplied."
            echo "The project's debug-signing fallback will be used."
          fi

      - name: Build Kayroot Engine release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$SOURCE" ]; then
            echo "::error::Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          cp "$SOURCE" KayrootEngine-v2.2.apk

          ls -lh KayrootEngine-v2.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KayrootEngine-v2.2-apk
          path: KayrootEngine-v2.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KayrootEngine-v2.2.apk
          generate_release_notes: true
