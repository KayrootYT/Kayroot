name: Build Kayroot Engine APK v2.20

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kayroot Engine 2.20
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager not found."
            find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 4. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 5. Extract Kayroot Engine v2.20
      - name: Extract Kayroot Engine v2.20
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/Kayroot_Engine_2_20.zip"
          DEST="$RUNNER_TEMP/kayroot220"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Kayroot_Engine_2_20.zip not found in repository root."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          SETTINGS_FILE=$(find "$DEST" \
            -name settings.gradle.kts \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          echo "----- Project settings -----"
          cat "$SETTINGS_FILE"

      # 6. Verify project configuration
      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          grep -Eq 'applicationId\s*=\s*"com\.kayroot\.engine"' "$GRADLE_FILE" || {
            echo "::error::Unexpected application ID."
            exit 1
          }

          grep -Eq 'versionCode\s*=\s*220([[:space:]]|$)' "$GRADLE_FILE" || {
            echo "::error::Expected versionCode = 220."
            exit 1
          }

          grep -Eq 'versionName\s*=\s*"2\.20"' "$GRADLE_FILE" || {
            echo "::error::Expected versionName = \"2.20\"."
            exit 1
          }

          echo "Kayroot Engine v2.20 configuration verified."

      # 7. Configure optional release signing
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            : "${KS_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
            : "${KS_ALIAS:?Missing KEY_ALIAS secret}"
            : "${KS_KEY_PASSWORD:?Missing KEY_PASSWORD secret}"

            KS="$RUNNER_TEMP/kayroot-release.jks"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"

            echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> "$GITHUB_ENV"

            echo "Release keystore configured."
          else
            echo "No custom keystore configured."
            echo "Using the project's configured signing settings."
          fi

      # 8. Build release APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 9. Find, verify and rename APK
      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          OUTPUT="$GITHUB_WORKSPACE/KayrootEngine-v2.20.apk"

          SOURCE="$APK_DIR/app-release.apk"

          if [ ! -f "$SOURCE" ]; then
            SOURCE=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          fi

          if [ -z "${SOURCE:-}" ] || [ ! -f "$SOURCE" ]; then
            echo "::error::Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          cp "$SOURCE" "$OUTPUT"

          echo "APK successfully generated:"
          ls -lh "$OUTPUT"

      # 10. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KayrootEngine-v2.20-apk
          path: KayrootEngine-v2.20.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Publish GitHub Release for version tags
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KayrootEngine-v2.20.apk
          generate_release_notes: true
