
name: Build Kayroot Engine APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kayroot Engine 2.2
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK setup
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager not found at $SDKMANAGER"
            find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 4. Gradle setup
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 5. Extract only Kayroot Engine 2.2
      - name: Extract Kayroot Engine 2.2
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/Kayroot_Engine_2_2.zip"
          DEST="$RUNNER_TEMP/kayroot22"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Kayroot_Engine_2_2.zip not found in repository root."
            echo "Upload the ZIP to your GitHub repository."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          F=$(find "$DEST" \
            -name settings.gradle.kts \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$F")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Kayroot project: $PROJECT_DIR"

          echo "----- Project settings -----"
          cat "$F"

      # 6. Validate project configuration
      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'com.kayroot.engine' "$GRADLE_FILE" || {
            echo "::error::Unexpected application ID."
            exit 1
          }

          grep -q 'versionCode = 22' "$GRADLE_FILE" || {
            echo "::error::Expected versionCode 22."
            exit 1
          }

          grep -q 'versionName = "2.2"' "$GRADLE_FILE" || {
            echo "::error::Expected versionName 2.2."
            exit 1
          }

          echo "Project configuration verified."

      # 7. Optional release signing
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            : "${KS_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
            : "${KS_ALIAS:?Missing KEY_ALIAS secret}"
            : "${KS_KEY_PASSWORD:?Missing KEY_PASSWORD secret}"

            KS="$RUNNER_TEMP/kayroot-release.jks"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"

            echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> "$GITHUB_ENV"

            echo "Release keystore configured."
          else
            echo "No custom keystore configured."
            echo "The project will use its configured debug-signing fallback."
          fi

      # 8. Build release APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 9. Verify and rename APK
      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          OUTPUT="$GITHUB_WORKSPACE/KayrootEngine-v2.2.apk"

          if [ ! -f "$SOURCE" ]; then
            echo "::error::Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          cp "$SOURCE" "$OUTPUT"

          echo "APK successfully generated:"
          ls -lh "$OUTPUT"

      # 10. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KayrootEngine-v2.2-apk
          path: KayrootEngine-v2.2.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Publish release when a v* tag is pushed
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KayrootEngine-v2.2.apk
          generate_release_notes: true
          
